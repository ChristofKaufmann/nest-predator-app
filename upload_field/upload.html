<!-- the texts are set by upload.js in the user's language -->
<div class="zone">
  <p class="title"></p>
  <p class="hint"></p>
  <div class="buttons">
    <button type="button" class="pick-files"></button>
    <button type="button" class="pick-folder"></button>
  </div>
  <input type="file" class="files" multiple accept=".jpg,.jpeg,.png,.bmp,.tif,.tiff,.webp" hidden>
  <input type="file" class="folder" webkitdirectory hidden>
</div>
<div class="status" hidden>
  <div class="bar"><div></div></div>
  <div class="line">
    <span class="text"></span>
    <button type="button" class="cancel"></button>
  </div>
  <div class="notes">
    <ul class="details"></ul>
    <button type="button" class="dismiss">×</button>
  </div>
</div>
