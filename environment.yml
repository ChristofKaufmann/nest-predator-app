# Conda environment to run the program without Docker, see README.md. Darknet and DarkHelp have to be installed
# separately, see CONTRIBUTING.md. The pip alternative is requirements.txt.
name: nest-predator
channels:
  - conda-forge
dependencies:
  - python=3.14
  - streamlit=1.66.1
  - altair>=5
  - numpy>=2
  - openpyxl>=3.1
  - pandas>=2
  - pillow>=10.1
