[client]
# no deploy button and no developer menu; the menu disappears completely as there are no other entries
toolbarMode = "minimal"

[server]
headless = true
# Reloading changed modules would give the app script a new `analysis` module while the upload route keeps the old
# one, so uploads would no longer find their session. Restart the server after code changes instead.
fileWatcherType = "none"

[browser]
gatherUsageStats = false

# Chart colours for light and dark mode, from a colour-blind-safe palette. The charts in app.py refer to them (scale
# ranges "category" and "diverging", default mark colour) instead of fixed colours, so they follow a change of the theme
# right away. Categorical: blue for "detected", orange for "not detected", the rest in fixed order. Diverging: the
# confidence in the timeline, five orange colours from low to high below the threshold and five blue ones from it on
# (see shade() in app.py). The orange ones have the lightness of the blue ones and their chroma as far as possible
# (OKLCH). In dark mode both halves are reversed, so that low values fade into the background.
[theme.light]
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]
chartDivergingColors = ["#f8d8ca", "#e69f7e", "#c35105", "#993e03", "#5d2302",
                        "#cde2fb", "#86b6ef", "#2a78d6", "#1c5cab", "#0d366b"]

[theme.dark]
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"]
chartDivergingColors = ["#5d2302", "#993e03", "#c35105", "#e69f7e", "#f8d8ca",
                        "#0d366b", "#1c5cab", "#2a78d6", "#86b6ef", "#cde2fb"]
